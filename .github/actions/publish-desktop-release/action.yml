name: Publish desktop release
description: >-
  Verify a complete three-platform desktop package set against its manifests,
  write SHA256SUMS.txt, re-check that the tag still targets this revision, and
  publish the GitHub Release. Shared by the full-build fallback and the
  prebuild-promotion paths of release-desktop.yml so both publish identically.

inputs:
  assets-dir:
    description: Directory holding the three packages and their desktop-package-<platform>.json manifests.
    required: true
  version:
    description: Release version without the leading v.
    required: true
  tag:
    description: Release tag name (the pushed tag).
    required: true
  prerelease:
    description: "'true' for prerelease tags."
    required: true
  revision:
    description: Commit the release must be built from (the tag's commit).
    required: true

runs:
  using: composite
  steps:
    # 硬门禁：三平台齐全、manifest 的版本 / revision / 文件名与本次发布一致、
    # 每个安装包的大小与 sha256 和 manifest 一致；同时写出 SHA256SUMS.txt。
    - name: Verify complete desktop release set
      shell: bash
      env:
        ASSETS_DIR: ${{ inputs.assets-dir }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_REVISION: ${{ inputs.revision }}
      run: |
        find "$ASSETS_DIR" -maxdepth 1 -type f -print | sort
        # 校验和写到 assets-dir 之外：发布出去的只有安装包和源码包，
        # 但逐个比对 sha256 的硬门禁照旧执行。
        python3 "$GITHUB_WORKSPACE/.github/scripts/release_candidate_manifest.py" verify-desktop \
          --dir "$ASSETS_DIR" \
          --version "$RELEASE_VERSION" \
          --revision "$RELEASE_REVISION" \
          --check-files \
          --sums-out "$RUNNER_TEMP/SHA256SUMS.txt"
        cat "$RUNNER_TEMP/SHA256SUMS.txt"

    - name: Verify release tag still targets this revision
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_REVISION: ${{ inputs.revision }}
      run: |
        head_sha="$(git rev-parse HEAD)"
        remote_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk 'NR == 1 { print $1 }')"
        if [ -z "$remote_sha" ]; then
          remote_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk 'NR == 1 { print $1 }')"
        fi
        if [ "$head_sha" != "$RELEASE_REVISION" ] || [ "$remote_sha" != "$RELEASE_REVISION" ]; then
          echo "Release tag moved while this run was building: head=$head_sha remote=$remote_sha expected=$RELEASE_REVISION" >&2
          exit 1
        fi

    # 源码包随安装包一起发：ops/release/build_source_archive.py 从本 commit 的
    # git 树打包后端工作区（带 SOURCE.json 记录 revision / 版本 / 树号）。
    # 它的 sha256 补进同一份校验和，下载后能对上这一版。
    - name: Build backend source archive
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        archive="$GITHUB_WORKSPACE/${{ inputs.assets-dir }}/retainpdf-backend-${{ inputs.version }}.tar.gz"
        python3 "$GITHUB_WORKSPACE/ops/release/build_source_archive.py" --output "$archive" --force
        # 脚本按 backend/pyproject.toml 定版本，文件名按 tag 定；发版前提是两者相等，
        # 这里再验一次，不一致就硬失败，不让包名和内容对不上。
        archived="$(python3 -c 'import json,sys,tarfile; a=tarfile.open(sys.argv[1]); m=next(n for n in a.getnames() if n.endswith("/SOURCE.json")); print(json.loads(a.extractfile(m).read())["version"])' "$archive")"
        if [ "$archived" != "$RELEASE_VERSION" ]; then
          echo "source archive declares version $archived but this release is $RELEASE_VERSION" >&2
          exit 1
        fi
        sha256sum "$archive" >> "$RUNNER_TEMP/SHA256SUMS.txt"
        cat "$RUNNER_TEMP/SHA256SUMS.txt"

    - name: Publish complete desktop release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ github.token }}
        tag_name: ${{ inputs.tag }}
        prerelease: ${{ inputs.prerelease == 'true' }}
        fail_on_unmatched_files: true
        files: |
          ${{ inputs.assets-dir }}/RetainPDF-Windows-${{ inputs.version }}-Setup.exe
          ${{ inputs.assets-dir }}/RetainPDF-Linux-${{ inputs.version }}.deb
          ${{ inputs.assets-dir }}/RetainPDF-Mac-${{ inputs.version }}.dmg
          ${{ inputs.assets-dir }}/retainpdf-backend-${{ inputs.version }}.tar.gz
